spring.application.name=GreenDay

# --- Banco de dados (H2 em memoria para dev) ---
spring.datasource.url=jdbc:h2:mem:greenday;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
greenday.jwt.secret=Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1mb3ItZ3JlZW5kYXktand0LXNpZ25pbmc=
greenday.jwt.expiration-ms=86400000

# --- API meteorologica (OpenWeatherMap) ---
greenday.clima.api-key=CHANGE_ME
greenday.clima.base-url=https://api.openweathermap.org/data/2.5

server.port=8080
