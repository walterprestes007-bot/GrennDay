<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Green Day - Login</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>

<body>

<main class="login-page">

    <!-- Fundo -->
    <div class="background"></div>

    <!-- Conteúdo -->
    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            <span>GREEN</span>
            <span>DAY</span>
        </div>

        <!-- Card -->
        <div class="login-card">

            <div class="card-leaves">

                <!-- Folha superior direita -->
                <svg class="leaf-svg leaf-top-right"
                     viewBox="0 0 100 100"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 85C25 45 55 15 90 10C85 45 65 75 15 85Z"/>
                    <path d="M18 82C40 62 62 40 88 13"
                          class="leaf-line"/>
                </svg>

                <!-- Folha esquerda -->
                <svg class="leaf-svg leaf-left"
                     viewBox="0 0 100 100"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 88C20 50 48 20 88 12C80 55 52 82 12 88Z"/>
                    <path d="M15 85C35 65 55 42 85 15"
                          class="leaf-line"/>
                </svg>

                <!-- Folha inferior direita -->
                <svg class="leaf-svg leaf-bottom-right"
                     viewBox="0 0 100 100"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 90C20 48 50 18 90 10C82 50 55 80 10 90Z"/>
                    <path d="M15 85C38 62 60 38 87 13"
                          class="leaf-line"/>
                </svg>

                <!-- Pequena folha inferior esquerda -->
                <svg class="leaf-svg leaf-bottom-left"
                     viewBox="0 0 100 100"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 82C25 48 50 25 82 18C75 50 52 75 18 82Z"/>
                    <path d="M20 80C40 60 58 42 80 20"
                          class="leaf-line"/>
                </svg>

            </div>

            <h1>Acessar conta</h1>

            <p class="subtitle">
                Entre para continuar no Green Day
            </p>

            <form th:action="@{/login}" method="post">

                <!-- E-mail -->
                <div class="input-group">

                    <label for="username">
                        E-mail ou CPF
                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Digite seu e-mail ou CPF"
                            required
                    >

                </div>

                <!-- Senha -->
                <div class="input-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Digite sua senha"
                            required
                    >

                </div>

                <!-- Esqueci senha -->
                <div class="forgot-password">
                    <a href="/esqueci-senha">
                        Esqueceu sua senha?
                    </a>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="btn-login">
                    Entrar
                </button>

            </form>

            <!-- Divisor -->
            <div class="divider">
                <span>ou</span>
            </div>

            <!-- Google -->
            <button type="button" class="social-button">
                <span class="google-icon">G</span>
                Continuar com o Google
            </button>

            <!-- Telefone -->
            <button type="button" class="social-button">
                <span class="phone-icon">☎</span>
                Continuar com telefone
            </button>

            <!-- Cadastro -->
            <p class="register-text">
                Ainda não possui uma conta?
                <a href="/cadastro">Criar conta</a>
            </p>

        </div>

    </div>

</main>

</body>
</html>
<!-- Folhas decorativas -->
<div class="leaves">
    <span class="leaf leaf-1">🍃</span>
    <span class="leaf leaf-2">🌿</span>
    <span class="leaf leaf-3">🍃</span>
    <span class="leaf leaf-4">🌱</span>
    <span class="leaf leaf-5">🍃</span>
    <span class="leaf leaf-6">🌿</span>
    <span class="leaf leaf-7">🍃</span>
    <span class="leaf leaf-8">🌱</span>
</div>
